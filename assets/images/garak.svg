<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="grad-garak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <pattern id="pattern-garak" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.08)" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad-garak)" />
  <rect width="100%" height="100%" fill="url(#pattern-garak)" />
  
  <!-- Subtle decorative ambient shapes -->
  <circle cx="720" cy="80" r="160" fill="rgba(255,255,255,0.04)" />
  <circle cx="100" cy="380" r="140" fill="rgba(0,0,0,0.15)" />
  <path d="M-50,250 Q200,180 400,280 T850,220 L850,450 L-50,450 Z" fill="rgba(0,0,0,0.25)" />

  <!-- Badge Pill -->
  <g transform="translate(60, 70)">
    <rect width="190" height="34" rx="17" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="95" y="22" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">송파구 · 농수산물 도매</text>
  </g>

  <!-- Large Icon -->
  <g transform="translate(640, 180)">
    <circle cx="0" cy="0" r="64" fill="rgba(255,255,255,0.12)" stroke="#ffe0b2" stroke-width="2"/>
    <text x="0" y="22" font-size="52" text-anchor="middle">🍎</text>
  </g>

  <!-- Title & Description -->
  <text x="60" y="210" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">가락시장</text>
  <text x="60" y="260" font-family="'Pretendard', sans-serif" font-size="18" font-weight="500" fill="#ffe0b2" letter-spacing="-0.2">국내 최대 농수산물 유통 허브 & 가락몰</text>

  <!-- Bottom Tagline Bar -->
  <g transform="translate(60, 360)">
    <rect width="320" height="38" rx="8" fill="rgba(0,0,0,0.35)" />
    <circle cx="20" cy="19" r="6" fill="#ffe0b2" />
    <text x="36" y="24" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" fill="#ffffff">SEOUL LOCAL MARKET TRAVEL GUIDE</text>
  </g>
</svg>